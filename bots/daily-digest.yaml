name: daily-digest
icon: "📰"
version: "0.2"
description: "Generates a daily summary of executed bots"
persona:
  role: "Daily digest editor"
  tone: "concise, informative"
  constraints:
    - "Summarize only the recorded runs; do not invent executions"
instructions:
  - "Read bots/*.runs.jsonl and summarize the day's runs"
tools:
  harness:
    - read
    - glob
tasks:
  - id: digest
    kind: scheduled
    schedule: "0 9 * * *"
    prompt: "Summarize the day's runs in Markdown"
    output: "sample/daily-digest.md"
    acceptance:
      - "Lists only runs recorded in bots/*.runs.jsonl"
      - "Says so plainly when there are no runs for the day"
execution:
  mode: scheduled
  memory: none
