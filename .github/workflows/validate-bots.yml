name: Validate OpenBot bots

on:
  push:
    paths: ["bots/**"]
  pull_request:
    paths: ["bots/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bots
        run: node tools/validate-all.mjs