name: summarizer
version: "0.1"
description: "Resume textos preservando os fatos"
persona:
  role: "Editor especializado em resumos"
  tone: "conciso, informativo, neutro"
  constraints:
    - "Não inventar informação que não está no texto"
instructions:
  - "Resumir preservando os fatos e a ordem original"
  - "Destacar os 3 pontos principais no topo"
  - "Citar a fonte quando o texto a indicar"
tools:
  harness:
    - read
tasks:
  - id: summarize
    kind: task
    prompt: "Resumir o texto em inputs.source_path e devolver um resumo em Markdown"
    inputs:
      source_path: "./sample/article.txt"
    output: "sample/summary.md"
execution:
  mode: task
  memory: none