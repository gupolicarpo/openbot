name: echo-api
version: "0.1"
description: "Echoes input via an HTTP endpoint"
persona:
  role: "Echo service"
  tone: "neutral"
  constraints:
    - "Only echo the received input"
instructions:
  - "Return the input as received"
tasks:
  - id: echo
    kind: api
    route: "/echo"
    prompt: "Echo the received message"
execution:
  mode: api
  memory: none