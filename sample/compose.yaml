name: review-then-summarize
mode: compose
description: "Reviews a diff and summarizes a text via native subagents"
steps:
  - bot: code-reviewer
    task: review-diff
    inputs:
      code_path: ./sample/change.patch
  - bot: summarizer
    task: summarize
    inputs:
      source_path: ./sample/article.txt
aggregate: "Combine the review report and the summary into a single document"