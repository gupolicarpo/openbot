name: summarizer
icon: "📝"
version: "0.1"
description: "Summarizes texts preserving the facts"
persona:
  role: "Summary editor"
  tone: "concise, informative, neutral"
  constraints:
    - "Do not invent information that is not in the text"
instructions:
  - "Summarize preserving the facts and original order"
  - "Highlight the top 3 points at the top"
  - "Cite the source when the text indicates one"
tools:
  harness:
    - read
tasks:
  - id: summarize
    kind: task
    prompt: "Summarize the text in inputs.source_path and return a Markdown summary"
    inputs:
      source_path: "./sample/article.txt"
    output: "sample/summary.md"
execution:
  mode: task
  memory: none