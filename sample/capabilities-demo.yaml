name: explorer
version: "0.1"
description: "Read-only exploration bot using a capability preset"
persona:
  role: "Code explorer"
  tone: "objective"
instructions:
  - "Locate and describe files without modifying them"
capabilities: explore
tasks:
  - id: explore
    kind: task
    prompt: "Describe the structure of bots/*.yaml"
execution:
  mode: task
  memory: none