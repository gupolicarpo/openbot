name: Validate OpenBot bots

on:
  push:
    paths: ["bots/**"]
  pull_request:
    paths: ["bots/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install js-yaml
        run: npm install js-yaml@4 --prefix /tmp/openbot-deps
      - name: Validate bots
        run: node tools/validate-all.mjs
        env:
          OPENBOT_JSYAML: /tmp/openbot-deps/node_modules/js-yaml/index.js